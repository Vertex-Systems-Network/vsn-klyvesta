version: '3.8'

services:
  # Klyvesta API Service
  klyvesta-api:
    image: klyvesta-api:latest
    build:
      context: .
      dockerfile: src/Klyvesta.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Database=klyvesta;Username=postgres;Password=${DB_PASSWORD:-SecurePass123!}
      - Serilog__MinimumLevel=Information
      - RateLimiting__Enabled=true
      - RateLimiting__MaxRequestsPerMinute=100
      - Broker__Mode=Paper # Switch to 'Live' when credentials are ready
      - Security__PayloadSigningKey=${PAYLOAD_SIGNING_KEY:-ChangeMeInProduction}
    ports:
      - "5000:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - klyvesta-net

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=klyvesta
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-SecurePass123!}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - klyvesta-net

  # Redis for Rate Limiting and Caching
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - klyvesta-net

  # Prometheus for Monitoring (Optional but recommended for P4)
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    depends_on:
      - klyvesta-api
    networks:
      - klyvesta-net

  # Grafana for Dashboards (Optional but recommended for P4)
  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - klyvesta-net

volumes:
  pgdata:
  redis-data:
  prometheus-data:
  grafana-data:

networks:
  klyvesta-net:
    driver: bridge
