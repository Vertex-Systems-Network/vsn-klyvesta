name: f2-postgres

on:
  push:
    branches:
      - "foundation/f2-postgres-persistence"
    paths:
      - ".github/workflows/*.yml"
      - ".ai/state.json"
      - ".ai/checkpoints/**"
      - ".config/dotnet-tools.json"
      - "Directory.Packages.props"
      - "src/Klyvesta.Infrastructure/**"
      - "tests/sql/**"
  pull_request:
    branches:
      - "foundation/f1-dotnet-skeleton"

permissions:
  contents: read

concurrency:
  group: f2-postgres-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip
  KLYVESTA_DB_CONNECTION: "Host=127.0.0.1;Port=5432;Database=klyvesta_f2;Username=postgres;Password=ci-${{ github.run_id }}-${{ github.run_attempt }};Include Error Detail=false"
  PGHOST: 127.0.0.1
  PGPORT: "5432"
  PGDATABASE: klyvesta_f2
  PGUSER: postgres
  PGPASSWORD: "ci-${{ github.run_id }}-${{ github.run_attempt }}"

jobs:
  verify-persistence:
    name: PostgreSQL migration and constraints
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: klyvesta_f2
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "ci-${{ github.run_id }}-${{ github.run_attempt }}"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d klyvesta_f2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore tools and infrastructure
        run: |
          dotnet tool restore
          dotnet restore src/Klyvesta.Infrastructure/Klyvesta.Infrastructure.csproj

      - name: Verify formatting
        run: dotnet format src/Klyvesta.Infrastructure/Klyvesta.Infrastructure.csproj --verify-no-changes --no-restore

      - name: Build infrastructure
        run: dotnet build src/Klyvesta.Infrastructure/Klyvesta.Infrastructure.csproj --configuration Release --no-restore

      - name: Verify PostgreSQL server version
        run: |
          version="$(psql -Atqc 'SHOW server_version;')"
          version_num="$(psql -Atqc 'SHOW server_version_num;')"
          echo "PostgreSQL server: ${version} (${version_num})"
          test "${version_num}" = "180006"

      - name: Verify migration model has no drift
        run: |
          dotnet ef migrations has-pending-model-changes \
            --project src/Klyvesta.Infrastructure/Klyvesta.Infrastructure.csproj \
            --context KlyvestaDbContext \
            --configuration Release \
            --no-build

      - name: Apply migrations
        run: |
          dotnet ef database update \
            --project src/Klyvesta.Infrastructure/Klyvesta.Infrastructure.csproj \
            --context KlyvestaDbContext \
            --configuration Release \
            --no-build

      - name: Verify database constraints
        run: psql --file tests/sql/f2_persistence_constraints.sql

      - name: Generate idempotent migration script
        run: |
          dotnet ef migrations script --idempotent \
            --project src/Klyvesta.Infrastructure/Klyvesta.Infrastructure.csproj \
            --context KlyvestaDbContext \
            --configuration Release \
            --no-build \
            --output /tmp/klyvesta-f2-idempotent.sql
          test -s /tmp/klyvesta-f2-idempotent.sql

      - name: Roll back migrations to zero
        run: |
          dotnet ef database update 0 \
            --project src/Klyvesta.Infrastructure/Klyvesta.Infrastructure.csproj \
            --context KlyvestaDbContext \
            --configuration Release \
            --no-build

      - name: Verify rollback removed F2 tables
        run: |
          test "$(psql -Atqc "SELECT to_regclass('ops.idempotency_record') IS NULL;")" = "t"
          test "$(psql -Atqc "SELECT to_regclass('ops.inbox_message') IS NULL;")" = "t"
          test "$(psql -Atqc "SELECT to_regclass('notification.outbox') IS NULL;")" = "t"

      - name: Re-apply migrations after rollback
        run: |
          dotnet ef database update \
            --project src/Klyvesta.Infrastructure/Klyvesta.Infrastructure.csproj \
            --context KlyvestaDbContext \
            --configuration Release \
            --no-build
          psql --file tests/sql/f2_persistence_constraints.sql
