name: dotnet-foundation

on:
  push:
    branches:
      - main
      - "foundation/**"
      - "parallel/**"
    paths:
      - ".github/workflows/*.yml"
      - ".ai/state.json"
      - ".ai/checkpoints/**"
      - ".ai/agent-orchestration.yaml"
      - ".ai/parallel-branch-registry.yaml"
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "NuGet.config"
      - "src/**"
      - "tools/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dotnet-foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  build-and-verify:
    name: Build and auto-discover verifiers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Display SDK information
        run: dotnet --info

      - name: Discover verifier projects
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t verifiers < <(find tools -type f -name '*Verifier.csproj' -print | sort)
          if [ "${#verifiers[@]}" -eq 0 ]; then
            echo "No verifier projects discovered under tools/."
            exit 1
          fi
          printf 'Discovered %d verifier project(s):\n' "${#verifiers[@]}"
          printf ' - %s\n' "${verifiers[@]}"

      - name: Restore API and all verifiers
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore src/Klyvesta.Api/Klyvesta.Api.csproj
          while IFS= read -r project; do
            echo "Restoring ${project}"
            dotnet restore "${project}"
          done < <(find tools -type f -name '*Verifier.csproj' -print | sort)

      - name: Verify formatting
        shell: bash
        run: |
          set -euo pipefail
          dotnet format src/Klyvesta.Api/Klyvesta.Api.csproj --verify-no-changes --no-restore
          while IFS= read -r project; do
            echo "Formatting check ${project}"
            dotnet format "${project}" --verify-no-changes --no-restore
          done < <(find tools -type f -name '*Verifier.csproj' -print | sort)

      - name: Build API graph
        run: dotnet build src/Klyvesta.Api/Klyvesta.Api.csproj --configuration Release --no-restore

      - name: Build all verifiers
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r project; do
            echo "Building ${project}"
            dotnet build "${project}" --configuration Release --no-restore
          done < <(find tools -type f -name '*Verifier.csproj' -print | sort)

      - name: Run all verifiers
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r project; do
            echo "Running ${project}"
            dotnet run --project "${project}" --configuration Release --no-build
          done < <(find tools -type f -name '*Verifier.csproj' -print | sort)
