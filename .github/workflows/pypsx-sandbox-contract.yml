name: pyPSX sandbox contract test

on:
  workflow_dispatch:
    inputs:
      run_order_test:
        description: "Place one small sandbox order after account/config checks"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  pypsx-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://brokerapi-paper.pypsx.com
      KEY_ID: ${{ secrets.PYPSX_SANDBOX_KEY_ID }}
      KEY_SECRET: ${{ secrets.PYPSX_SANDBOX_SECRET }}
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          test -n "$KEY_ID" || { echo "::error::Missing PYPSX_SANDBOX_KEY_ID"; exit 1; }
          test -n "$KEY_SECRET" || { echo "::error::Missing PYPSX_SANDBOX_SECRET"; exit 1; }

      - name: Public health check
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --retry 2 "$BASE_URL/health"

      - name: Authenticated config check
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error             -H "PYPSX-ORG-API-KEY-ID: $KEY_ID"             -H "PYPSX-ORG-API-SECRET-KEY: $KEY_SECRET"             "$BASE_URL/v1/partner-api/config" | tee config.json
          grep -q '"environment"[[:space:]]*:[[:space:]]*"sandbox"' config.json

      - name: Create sandbox account
        shell: bash
        run: |
          REF="klyvesta-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          jq -n --arg ref "$REF"             '{full_name:"Klyvesta CI Sandbox",email:("ci-"+$ref+"@example.invalid"),partner_reference_id:$ref}' > account-request.json
          curl --fail-with-body --silent --show-error --retry 2             -X POST "$BASE_URL/v1/partner-api/accounts"             -H "Content-Type: application/json"             -H "PYPSX-ORG-API-KEY-ID: $KEY_ID"             -H "PYPSX-ORG-API-SECRET-KEY: $KEY_SECRET"             --data-binary @account-request.json | tee account.json
          test -s account.json
          jq -e '.account_id' account.json >/dev/null
          echo "ACCOUNT_ID=$(jq -r '.account_id' account.json)" >> "$GITHUB_ENV"

      - name: Read sandbox portfolio
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error             -H "PYPSX-ORG-API-KEY-ID: $KEY_ID"             -H "PYPSX-ORG-API-SECRET-KEY: $KEY_SECRET"             "$BASE_URL/v1/partner-api/accounts/$ACCOUNT_ID/portfolio" | tee portfolio.json
          test -s portfolio.json

      - name: Optional small sandbox order
        if: ${{ inputs.run_order_test == true }}
        shell: bash
        run: |
          jq -n --arg account "$ACCOUNT_ID"             '{sub_account_id:$account,symbol:"OGDC",side:"BUY",quantity:1}' > order-request.json
          curl --fail-with-body --silent --show-error             -X POST "$BASE_URL/v1/partner-api/orders"             -H "Content-Type: application/json"             -H "PYPSX-ORG-API-KEY-ID: $KEY_ID"             -H "PYPSX-ORG-API-SECRET-KEY: $KEY_SECRET"             --data-binary @order-request.json | tee order.json
          test -s order.json
          jq -e '.order_id // .id' order.json >/dev/null

      - name: Secret-safe cleanup
        if: always()
        shell: bash
        run: |
          rm -f config.json account-request.json account.json portfolio.json order-request.json order.json
