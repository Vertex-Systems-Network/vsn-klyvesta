name: pyPSX sandbox contract test

on:
  workflow_dispatch:
    inputs:
      run_order_test:
        description: "Submit one unit and verify order lifecycle"
        required: false
        default: false
        type: boolean
      run_negative_tests:
        description: "Verify auth and invalid-order error boundaries"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  pypsx-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: https://brokerapi-paper.pypsx.com
      KEY_ID: ${{ secrets.PYPSX_SANDBOX_KEY_ID }}
      KEY_SECRET: ${{ secrets.PYPSX_SANDBOX_SECRET }}
    steps:
      - name: Validate required secrets
        run: |
          test -n "$KEY_ID" || { echo "::error::Missing PYPSX_SANDBOX_KEY_ID"; exit 1; }
          test -n "$KEY_SECRET" || { echo "::error::Missing PYPSX_SANDBOX_SECRET"; exit 1; }

      - name: Public health check
        run: |
          curl --fail-with-body --silent --show-error --retry 2 "$BASE_URL/health"

      - name: Authenticated config check
        run: |
          curl --fail-with-body --silent --show-error             -H "PYPSX-ORG-API-KEY-ID: $KEY_ID"             -H "PYPSX-ORG-API-SECRET-KEY: $KEY_SECRET"             "$BASE_URL/v1/partner-api/config" > config.json
          jq -e '.environment == "sandbox"' config.json

      - name: Create sandbox account
        run: |
          REF="klyvesta-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          jq -n --arg ref "$REF"             '{full_name:"Klyvesta CI Sandbox",email:("ci-"+$ref+"@example.invalid"),partner_reference_id:$ref}' > account-request.json
          curl --fail-with-body --silent --show-error --retry 2             -X POST "$BASE_URL/v1/partner-api/accounts"             -H "Content-Type: application/json"             -H "PYPSX-ORG-API-KEY-ID: $KEY_ID"             -H "PYPSX-ORG-API-SECRET-KEY: $KEY_SECRET"             --data-binary @account-request.json > account.json
          jq -e '.account_id' account.json >/dev/null
          echo "ACCOUNT_ID=$(jq -r '.account_id' account.json)" >> "$GITHUB_ENV"

      - name: Read initial portfolio
        run: |
          curl --fail-with-body --silent --show-error             -H "PYPSX-ORG-API-KEY-ID: $KEY_ID"             -H "PYPSX-ORG-API-SECRET-KEY: $KEY_SECRET"             "$BASE_URL/v1/partner-api/accounts/$ACCOUNT_ID/portfolio" > portfolio-before.json
          test -s portfolio-before.json

      - name: Submit and verify sandbox order lifecycle
        if: ${{ inputs.run_order_test == true }}
        shell: bash
        run: |
          jq -n --arg account "$ACCOUNT_ID"             '{sub_account_id:$account,symbol:"OGDC",side:"BUY",quantity:1}' > order-request.json
          curl --fail-with-body --silent --show-error             -X POST "$BASE_URL/v1/partner-api/orders"             -H "Content-Type: application/json"             -H "PYPSX-ORG-API-KEY-ID: $KEY_ID"             -H "PYPSX-ORG-API-SECRET-KEY: $KEY_SECRET"             --data-binary @order-request.json > order.json
          ORDER_ID=$(jq -r '.order_id // .id // empty' order.json)
          test -n "$ORDER_ID" || { echo "::error::Order ID missing"; exit 1; }
          echo "Order submission returned an order identifier."

          status=""
          for attempt in 1 2 3 4 5 6; do
            curl --fail-with-body --silent --show-error               -H "PYPSX-ORG-API-KEY-ID: $KEY_ID"               -H "PYPSX-ORG-API-SECRET-KEY: $KEY_SECRET"               "$BASE_URL/v1/partner-api/orders/$ORDER_ID" > order-status.json
            status=$(jq -r '.status // .state // empty' order-status.json | tr '[:lower:]' '[:upper:]')
            echo "Order lifecycle status: $status"
            case "$status" in
              FILLED|PARTIALLY_FILLED|CANCELED|CANCELLED|REJECTED|EXPIRED) break ;;
            esac
            sleep 5
          done
          test -n "$status" || { echo "::error::No order lifecycle status returned"; exit 1; }

          case "$status" in
            FILLED|PARTIALLY_FILLED)
              echo "Fill state observed: $status"
              ;;
            CANCELED|CANCELLED|REJECTED|EXPIRED)
              echo "Terminal non-fill state observed: $status"
              ;;
            *)
              curl --fail-with-body --silent --show-error                 -X DELETE "$BASE_URL/v1/partner-api/orders/$ORDER_ID"                 -H "PYPSX-ORG-API-KEY-ID: $KEY_ID"                 -H "PYPSX-ORG-API-SECRET-KEY: $KEY_SECRET" > cancel.json
              echo "Cancel request submitted for non-terminal order."
              ;;
          esac
          echo "ORDER_STATUS=$status" >> "$GITHUB_ENV"

      - name: Re-read portfolio and statement
        if: ${{ inputs.run_order_test == true }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error \
            -H "PYPSX-ORG-API-KEY-ID: $KEY_ID" \
            -H "PYPSX-ORG-API-SECRET-KEY: $KEY_SECRET" \
            "$BASE_URL/v1/partner-api/accounts/$ACCOUNT_ID/portfolio" > portfolio-after.json
          test -s portfolio-after.json

          TODAY=$(date -u +%F)
          curl --fail-with-body --silent --show-error \
            -H "PYPSX-ORG-API-KEY-ID: $KEY_ID" \
            -H "PYPSX-ORG-API-SECRET-KEY: $KEY_SECRET" \
            "$BASE_URL/v1/partner-api/accounts/$ACCOUNT_ID/statement?from=$TODAY&to=$TODAY" > statement.json
          test -s statement.json
          echo "Reconciliation reads completed with order status $ORDER_STATUS."

      - name: Verify negative API boundaries
        if: ${ inputs.run_negative_tests == true }
        shell: bash
        run: |
          set +e
          auth_status=$(curl --silent --show-error --output invalid-auth.json --write-out "%{http_code}" \
            -H "PYPSX-ORG-API-KEY-ID: invalid-key-id" \
            -H "PYPSX-ORG-API-SECRET-KEY: invalid-secret" \
            "$BASE_URL/v1/partner-api/config")
          test "$auth_status" = "401" || test "$auth_status" = "403" || {
            echo "::error::Invalid-auth boundary returned HTTP $auth_status; expected 401 or 403."
            exit 1
          }
          echo "Invalid-auth boundary returned expected HTTP $auth_status."

          printf '{"sub_account_id":"%s","symbol":"OGDC","side":"BUY","quantity":0}\n' "$ACCOUNT_ID" > invalid-order-request.json
          invalid_order_status=$(curl --silent --show-error --output invalid-order.json --write-out "%{http_code}" \
            -X POST "$BASE_URL/v1/partner-api/orders" \
            -H "Content-Type: application/json" \
            -H "PYPSX-ORG-API-KEY-ID: $KEY_ID" \
            -H "PYPSX-ORG-API-SECRET-KEY: $KEY_SECRET" \
            --data-binary @invalid-order-request.json)
          test "$invalid_order_status" -ge 400 || {
            echo "::error::Invalid-order boundary returned HTTP $invalid_order_status; expected 4xx."
            exit 1
          }
          echo "Invalid-order boundary returned expected HTTP $invalid_order_status."
          set -e

      - name: Secret-safe cleanup
        if: always()
        run: |
          rm -f config.json account-request.json account.json portfolio-before.json portfolio-after.json statement.json order-request.json order.json order-status.json cancel.json invalid-auth.json invalid-order-request.json invalid-order.json
