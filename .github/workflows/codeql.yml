name: codeql

on:
  push:
    branches:
      - main
      - "foundation/**"
    paths:
      - ".github/workflows/codeql.yml"
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "NuGet.config"
      - "src/**"
      - "tools/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/codeql.yml"
      - "global.json"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "NuGet.config"
      - "src/**"
      - "tools/**"
  schedule:
    - cron: "17 2 * * 3"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_XMLDOC_MODE: skip

jobs:
  analyze-csharp:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4 @ 2026-08-21
        with:
          languages: csharp
          queries: security-extended

      - name: Restore API graph
        run: dotnet restore src/Klyvesta.Api/Klyvesta.Api.csproj

      - name: Build API graph for CodeQL
        run: dotnet build src/Klyvesta.Api/Klyvesta.Api.csproj --configuration Release --no-restore

      - name: Analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4 @ 2026-08-21
        with:
          category: "/language:csharp"
