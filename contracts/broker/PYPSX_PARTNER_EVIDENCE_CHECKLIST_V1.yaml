version: 1
project: klyvesta
canonical_task: P0-T1
purpose: >-
  Machine-readable evidence checklist for evaluating direct pyPSX Broker API
  technical, legal, regulatory, operational and commercial onboarding evidence.
  Public marketing claims never satisfy fields that require partner-contract evidence.

status_values:
  - VERIFIED
  - UNVERIFIED
  - UNSUPPORTED
  - NOT_APPLICABLE
  - CONTRADICTORY

source_classes:
  - DIRECT_PARTNER_CONTRACT
  - DIRECT_PARTNER_TECHNICAL_DOC
  - DIRECT_PARTNER_EMAIL
  - REGULATOR_PRIMARY_SOURCE
  - EXCHANGE_PRIMARY_SOURCE
  - PUBLIC_VENDOR_MARKETING
  - INTERNAL_TEST_EVIDENCE

rules:
  production_verification_requires_direct_evidence: true
  public_marketing_can_satisfy_production_contract_fields: false
  contradictory_evidence_fails_closed: true
  unknown_external_financial_side_effect_maps_to: UNKNOWN
  blind_retry_after_ambiguous_side_effect_allowed: false
  llm_may_hold_broker_execution_credentials: false
  live_adapter_implementation_before_contract_verification_allowed: false

metadata:
  partner: pyPSX
  product: Broker API
  last_public_recheck: 2026-08-26
  public_rollout_state: CONTRADICTORY
  public_rollout_note: >-
    Fresher indexed official material represented Broker API as live/onboarding
    partners, while directly opened official snapshots still represented early
    access / sandbox-coming-soon / live-execution-in-development states.
  direct_partner_response_received:
    status: UNVERIFIED
    evidence_source: null
    verified_at: null
    note: >-
      Last known user-confirmed state is no reply received as of 2026-08-25.
      Do not infer inbox state after that date without direct evidence.

