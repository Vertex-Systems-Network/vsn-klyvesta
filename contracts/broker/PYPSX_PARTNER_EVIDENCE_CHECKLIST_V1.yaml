p0_gate_mapping:
  pypsx_broker_api_contract_obtained:
    state: NOT_MET
    requires:
      - rollout_and_onboarding.rollout_state
      - environments_and_transport.production_base_url
      - authentication_and_credentials.authentication_method
      - orders.order_status_enumeration
      - executions.stable_execution_id
  underlying_regulated_roles_identified:
    state: NOT_MET
    requires:
      - regulated_entities_and_roles.underlying_broker_legal_entity
      - regulated_entities_and_roles.secp_broker_licence
      - regulated_entities_and_roles.psx_trec_identity
  custody_settlement_flow_documented:
    state: PARTIAL_ONLY
    requires:
      - customer_legal_account_model.cdc_account_structure
      - customer_legal_account_model.nccpl_responsibility
      - customer_legal_account_model.legal_custodian
      - customer_legal_account_model.customer_cash_holder
  funding_flow_documented:
    state: NOT_MET
    requires:
      - funding.supported_deposit_rails
      - funding.deposit_reconciliation
      - customer_legal_account_model.customer_cash_holder
  market_data_rights_documented:
    state: NOT_MET
    requires:
      - market_data.source
      - market_data.real_time_or_delayed
      - market_data.redistribution_rights
  ai_assisted_legal_classification_documented:
    state: NOT_MET
    requires:
      - product_mode_regulatory_support.ai_assisted_recommendations
  discretionary_auto_legal_classification_documented:
    state: PARTIAL_ONLY
    requires:
      - regulated_entities_and_roles.securities_manager_path
      - product_mode_regulatory_support.guarded_auto_discretionary_management
      - product_mode_regulatory_support.minimum_customer_investment
  required_licence_or_licensed_partner_path_decided:
    state: NOT_MET
    requires:
      - regulated_entities_and_roles.underlying_broker_legal_entity
      - regulated_entities_and_roles.securities_manager_path
      - regulated_entities_and_roles.securities_adviser_path
      - regulated_entities_and_roles.research_analyst_path

acceptance_policy:
  p0_can_be_accepted_if_any_required_field_is_contradictory: false
  p0_can_be_accepted_if_any_required_field_is_unverified: false
  live_pypsx_adapter_can_start_from_public_marketing_only: false
  production_real_money_can_start_before_p0_acceptance: false
  guarded_auto_can_start_before_discretionary_permission_acceptance: false
