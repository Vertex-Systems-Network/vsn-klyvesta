    - supervisor-platform
    - ledger
    - identity-authorization
    - notifications
    - observability
    - performance-resilience
  dependency_chain:
    - brokerage
    - orders
    - portfolio
    - risk
    - compliance
    - ai-shadow
  integration_only_after:
    - exact-head-ci-green
    - zero-unresolved-review-threads
    - ownership-check-green
    - dependency-head-fresh
    - instruction-drift-check-recorded
    - security-review-complete
  protected_main_rule: promote to main only when repository governance permits it; otherwise integrate only on parallel/integration-staging and record the blocked promotion
