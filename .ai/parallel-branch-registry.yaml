  working_branch: parallel/supervisor-platform
  integration_branch: parallel/integration-staging
  main_branch: main
  responsibilities:
    - review every submitted module PR
    - verify ownership and dependency freshness
    - verify CI and security evidence
    - integrate accepted work in dependency order
    - publish refresh alerts after every accepted integration
    - resume paused supervisor work after review/integration

